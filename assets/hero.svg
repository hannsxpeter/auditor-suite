<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Auditor Suite 1.3.0</title>
  <desc id="d">Auditor Suite wordmark with the line: eight read-only audits, one scored report each. A status board lists 8 auditors, 85 dimensions, 1 report format, and read-only contract.</desc>
  <style>
