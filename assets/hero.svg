  <text x="600" y="28" class="mono" font-size="13" fill="#8B9BB4" text-anchor="middle">@hxp-tools/auditor-suite</text>
  <text x="1168" y="28" class="mono" font-size="13" fill="#8B9BB4" text-anchor="end">PRESS START  /secauditor quick</text>

