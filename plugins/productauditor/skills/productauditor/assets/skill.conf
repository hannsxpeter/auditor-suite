# skill.conf: per-skill settings read by the shared scripts (shell syntax).
SKILL_NAME="productauditor"
REPORT_FILE="productaudit.md"
REPORT_TITLE="Product audit"
AUDIT_NOUN="product audit"
HEADLINE="Product audit complete"
QUICK_HEADLINE="Product quick triage complete"
BANNER="The product was not run, and no analytics, billing, feature-flag, or CRM service was queried; findings that depend on real usage or provider settings are marked Likely or Suspected."
MAP_HINT="The product map in about half a page, every line ending in path:line or the words not stated or not found: who the product is for and the job it promises, quoted from the README, landing, or pricing copy (never inferred); the stage (prototype, pre-launch, growth, or enterprise) and the business model (B2C or B2B; free, freemium, trial, or paid; the billing provider or merchant of record, and how tax is handled) with the evidence; a promise inventory of five to ten sold or advertised capabilities, each as claim at path:line, delivered by path:line or not found; a money-path table of each plan with its shown price, the price id charged, its features and limits from the plan catalog, and where each is enforced (path:line, UI only, or not enforced); the lifecycle states with the handler that moves accounts between them and the missing ones named; the core value action and the activation event, each marked named or inferred, with the event or record that counts it or not measured; the flag and experiment mechanism and its kill switches, or no runtime switch; each feedback, support, and demand channel and where it lands; the product docs read with their last change date, or none checked in; the two or three load-bearing paths where money, access, or customer data change hands, traced hop by hop; and the single widest gap between what is promised and what the code does, with both locations"
DOMAIN_RULE="Fix money, access, and customer data first: make what customers are charged and granted match what they were shown and sold before tuning metrics or experiments, make a false claim true or remove it rather than soften it, change prices, plans, and limits in one catalog, and never close a revenue leak by deleting customer data or cutting off paying customers without notice. Confirm each Likely or Suspected finding in the billing provider's records, the analytics data, the flag service, or with the owner of the promise before changing pricing, plans, or customer-facing copy."
STOP_HINT="Without a surface people use (screens, a public API, a CLI, or a published package) or product configuration (plans, billing, analytics, or feature flags) there is no product to audit; internal scripts and infrastructure belong to codeauditor."
# Files the scans skip for this auditor only: tests, stories, fixtures, mocks,
# agent planning folders, archived docs, and lockfiles. Single-quoted (a regex
# with $); written for awk, so no [[:class:]] brackets (mawk).
SCAN_SKIP_RE='(^|/)(test|tests|__tests__|spec|e2e|cypress|playwright|fixtures|__fixtures__|__mocks__|mocks|stories|[.]storybook|[.]planning|[.]godplans|[.]godpowers|archive|archived)/|[.](test|spec|vitest|stories|story|e2e|cy)[.][A-Za-z0-9]+$|(^|/)test_[^/]*[.]py$|_test[.](py|go|rb|exs)$|(^|/)(package-lock[.]json|npm-shrinkwrap[.]json|yarn[.]lock|pnpm-lock[.]yaml|bun[.]lockb?|Gemfile[.]lock|poetry[.]lock|Pipfile[.]lock|uv[.]lock|composer[.]lock|Cargo[.]lock|go[.]sum|Podfile[.]lock|pubspec[.]lock|mix[.]lock|packages[.]lock[.]json)$'
