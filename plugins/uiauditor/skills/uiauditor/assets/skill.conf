# skill.conf: per-skill settings read by the shared scripts (shell syntax).
SKILL_NAME="uiauditor"
REPORT_FILE="uiaudit.md"
REPORT_TITLE="UI implementation audit"
AUDIT_NOUN="UI-implementation audit"
HEADLINE="UI implementation audit complete"
QUICK_HEADLINE="UI quick triage complete"
BANNER="The app was not run, and no browser, scanner, or build was used."
MAP_HINT="UI surface map in about half a page: the surfaces and load-bearing screens (landing page, primary task, auth, checkout); the document shell and globals (html lang, viewport meta, global reset, root layout, the token and theme source); the interactive inventory (custom controls, forms, and pointer handlers on elements that are not controls); the render-cost shape (the likely LCP element, heavy client islands, layout-shift sources); the adaptation surface (breakpoints, RTL, dark mode, reduced motion, locales); and the two or three highest-risk paths you traced end to end, with path:line at each step"
DOMAIN_RULE="Fix accessibility at the markup and the control: prefer the native element and a real label over a role or ARIA patch, fix the shared primitive or token once rather than each instance, and never remove a working label, focus style, token, or state branch to make another fix easier."
STOP_HINT="Without a rendered interface (a pure backend, library, or CLI) there is no UI to audit."
