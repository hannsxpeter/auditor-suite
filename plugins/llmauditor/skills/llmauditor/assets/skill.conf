# skill.conf: per-skill settings read by the shared scripts (shell syntax).
SKILL_NAME="llmauditor"
REPORT_FILE="llmaudit.md"
REPORT_TITLE="LLM integration audit"
AUDIT_NOUN="LLM-integration audit"
HEADLINE="LLM integration audit complete"
QUICK_HEADLINE="LLM integration quick triage complete"
BANNER="No model or embeddings endpoint was called, and the app and its agents were not run."
MAP_HINT="The LLM data-flow and trust map in about half a page: the entry points and untrusted-content sources (user input, retrieved documents, tool results, fetched pages, files, memory), the trust boundaries they cross (system prompt, tool arguments, output sinks), the sensitive assets and actions (data sent to the provider, tools with external or destructive effects and the credentials they run under), the lethal-trifecta surfaces, the models and budgets on each path, the retrieval stores and caches and how they stay in sync with their source, and the two or three highest-risk flows you traced end to end, with path:line at each hop"
DOMAIN_RULE="Treat all model output and all retrieved or tool content as untrusted: fix at the trust boundary and the sink in code, never by rewording the prompt, and keep every working guardrail, validator, retrieval filter, and approval gate. After any prompt or model change, run the eval suite (or add one), and never add a working jailbreak or exploit payload."
STOP_HINT="Without a provider SDK, a model call, an embeddings call, or an agent there is no LLM integration to audit."
