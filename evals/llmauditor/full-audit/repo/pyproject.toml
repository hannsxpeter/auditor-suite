[project]
name = "helpdesk-copilot"
version = "0.9.0"
description = "Multi-tenant helpdesk assistant with a storefront chat widget."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "openai>=1.99",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "tenacity>=9.0",
  "httpx>=0.27",
]

[tool.setuptools]
packages = ["app"]
