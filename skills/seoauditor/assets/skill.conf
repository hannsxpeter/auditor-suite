# skill.conf: per-skill settings read by the shared scripts (shell syntax).
SKILL_NAME="seoauditor"
REPORT_FILE="seoaudit.md"
REPORT_TITLE="SEO and AI visibility audit"
AUDIT_NOUN="SEO and AI-visibility audit"
HEADLINE="SEO and visibility audit complete"
QUICK_HEADLINE="SEO quick triage complete"
BANNER="The live site was not crawled, and no Lighthouse, Search Console, validator, or model was called."
MAP_HINT="The visibility and crawl map in about half a page: the indexation controls (robots.txt, meta robots, X-Robots-Tag, environment guards) and the routes they cover; which routes ship their content and head signals in the initial server HTML and which render on the client; the URL and canonical model (host, scheme, trailing slash, where canonicals and redirects come from); the content and entity signals (title templating, structured data, Organization or Person identity); the AI surface (AI-crawler rules, llms.txt, ai.txt); discovery and distribution (sitemaps, feeds, hreflang); and the two or three highest-leverage flows you traced from route to served HTML, with path:line at each hop"
DOMAIN_RULE="Fix the visibility floor first: make the site crawlable, indexable, server-rendered, and consistently canonical before tuning anything downstream. Remove inert theater, repair controls that defeat their own purpose, and never add llms.txt or ai.txt as if they were load-bearing."
STOP_HINT="Without templates, HTML, or a metadata layer there is no website to audit."
