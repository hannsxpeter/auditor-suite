# skill.conf: per-skill settings read by the shared scripts (shell syntax).
SKILL_NAME="dbauditor"
REPORT_FILE="dbaudit.md"
REPORT_TITLE="Database audit"
AUDIT_NOUN="database audit"
HEADLINE="Database audit complete"
QUICK_HEADLINE="Database quick triage complete"
BANNER="No database was connected, no migration was run, and no data was touched."
MAP_HINT="The data model in about half a page: the entities and the relationship graph, marking each link as DB-enforced (a real foreign key), ORM-only, or cross-service; the hot tables and the dominant queries; the write paths and transaction boundaries (money, inventory, counters, retried handlers); the growth-bearing tables; the search surfaces and derived stores and how they stay in sync; and the two or three highest-risk flows you traced end to end, with path:line at each hop"
DOMAIN_RULE="Apply every schema change with the lock-safe path: CREATE INDEX CONCURRENTLY, ADD CONSTRAINT ... NOT VALID then VALIDATE, expand-contract for renames and type changes, and batched backfills, so the fix does not cause the outage; never drop a working constraint, index, or generated column to make another fix easier."
STOP_HINT="Without a schema, migrations, ORM models, queries, or datastore configuration there is no database layer to audit."
