# skill.conf: per-skill settings read by the shared scripts (shell syntax).
SKILL_NAME="uxauditor"
REPORT_FILE="uxaudit.md"
REPORT_TITLE="UX audit"
AUDIT_NOUN="UX audit"
HEADLINE="UX audit complete"
QUICK_HEADLINE="UX quick triage complete"
BANNER="The product was not run; findings about runtime behavior are marked Likely or Suspected."
MAP_HINT="The experience map in about half a page: the primary actor and their top jobs to be done; two to four core journeys traced through the code, each as phases with the user's action and the likely emotional high or low, with path:line for every step; the single worst friction moment; the handoffs to other channels (email, SMS, another device, support); and the load-bearing flows (used by everyone, or guarding money, data, or trust)"
DOMAIN_RULE="Fix the core journeys first and keep deliberate safeguards: a confirmation before an irreversible action stays, a deceptive pattern is removed rather than softened, and a Likely or Suspected finding is confirmed in the running product, with analytics, or with users before anyone redesigns around it."
STOP_HINT="Without a human-facing or developer-facing surface (a UI, CLI, or API) or a modeled workflow there is no experience to audit."
