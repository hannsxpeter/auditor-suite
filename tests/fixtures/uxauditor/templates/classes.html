{% extends "base.html" %}
{% block content %}
<h1>Classes</h1>
<form method="get" action="{{ url_for('classes') }}">
  <label for="week">Week</label>
  <select id="week" name="week" onchange="this.form.submit()">
    <option value="this" {% if week == 'this' %}selected{% endif %}>This week</option>
    <option value="next" {% if week == 'next' %}selected{% endif %}>Next week</option>
  </select>
</form>
<ul class="classes">
  {% for cls in classes %}
  <li class="class-card">
    <img src="{{ url_for('static', filename=cls.photo) }}" alt="">
    <h2>{{ cls.name }} with {{ cls.teacher }}</h2>
    <p>{{ cls.starts }}</p>
    <p class="urgent">Hurry! Only {{ cls.spots_left }} spots left</p>
    <a class="button" href="{{ url_for('book', class_id=cls.id) }}">Book this class</a>
  </li>
  {% endfor %}
</ul>
{% endblock %}
