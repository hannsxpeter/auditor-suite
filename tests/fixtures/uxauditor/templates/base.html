<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stillwater Studio{% endblock %}</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header>
    <nav aria-label="Main">
      <a href="{{ url_for('classes') }}" {% if request.endpoint == 'classes' %}aria-current="page"{% endif %}>Classes</a>
      <a href="{{ url_for('account') }}" {% if request.endpoint == 'account' %}aria-current="page"{% endif %}>My membership</a>
    </nav>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
