<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pricing - Duebook</title>
</head>
<body>
  <h1>Simple pricing for freelancers</h1>
  <section class="plan">
    <h2>Free</h2>
    <p class="price">$0</p>
    <ul>
      <li>Up to 2 clients</li>
      <li>5 invoices a month</li>
    </ul>
  </section>
  <section class="plan">
    <h2>Pro</h2>
    <p class="price">$9/month</p>
    <ul>
      <li>Unlimited clients</li>
      <li>Unlimited invoices</li>
      <li>Invoice in any currency</li>
    </ul>
    <p>Start with a 14-day free trial of Pro. No card needed.</p>
    <form method="post" action="/billing/checkout">
      <button type="submit">Upgrade to Pro</button>
    </form>
  </section>
</body>
</html>
